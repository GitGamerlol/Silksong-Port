<!DOCTYPE html>
<html lang="en-us">

<head>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    #unity-container {
        width: 960px;
        height: 600px;
        margin: 0 auto;
    }

    #unity-canvas {
        width: 960px;
        height: 600px;
        display: block;
    }

    #loading-text {
        color: white;
        font-size: 48px;
        font-family: cursive;
        text-align: center;
        margin-top: 20px;
    }

    #cloak-button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }
    </style>
    <base href="./">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity Web Player | Hollow Knight SilkSong</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>

    <div id="loading-text">
        LOADING...
    </div>

    <button id="cloak-button">
        Open in about:blank
    </button>

    <div id="unity-container">

        <canvas
            id="unity-canvas"
            width="960"
            height="600"
            tabindex="-1">
        </canvas>

        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>

        </div>

        <div id="unity-warning"></div>

    </div>


<script>

    /* =========================================================
       BASIC SETUP
       ========================================================= */

    const loadingText =
        document.querySelector("#loading-text");

    const canvas =
        document.querySelector("#unity-canvas");

    const loadingBar =
        document.querySelector("#unity-loading-bar");

    const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

    const warningBanner =
        document.querySelector("#unity-warning");

    const cloakButton =
        document.querySelector("#cloak-button");


    /* =========================================================
       ABOUT:BLANK CLOAK
       ========================================================= */

    cloakButton.addEventListener("click", function () {

        const newWindow =
            window.open("about:blank", "_blank");

        if (!newWindow) {
            alert("Your browser blocked the popup. Please allow popups for this site.");
            return;
        }

        const currentHTML =
            document.documentElement.outerHTML;

        newWindow.document.open();
        newWindow.document.write(currentHTML);
        newWindow.document.close();

        window.location.replace("about:blank");
    });


    /* =========================================================
       UNITY WARNING
       ========================================================= */

    function unityShowBanner(msg, type) {

        function update() {

            warningBanner.style.display =
                warningBanner.children.length
                    ? "block"
                    : "none";
        }

        const div =
            document.createElement("div");

        div.innerHTML = msg;

        warningBanner.appendChild(div);

        if (type === "error") {

            div.style =
                "background:red;padding:10px;";

        } else {

            if (type === "warning") {

                div.style =
                    "background:yellow;padding:10px;";
            }

            setTimeout(() => {

                if (div.parentNode) {

                    warningBanner.removeChild(div);
                }

                update();

            }, 5000);
        }

        update();
    }


    /* =========================================================
       UNITY CONFIG
       ========================================================= */

    const buildUrl =
        "Build";

    const config = {

        dataUrl:
            buildUrl + "/w-pt.data.unityweb",

        frameworkUrl:
            buildUrl + "/w-pt.framework.js.unityweb",

        codeUrl:
            buildUrl + "/w-pt.wasm.unityweb",

        /*
         * Addressables remain in StreamingAssets.
         *
         * These are the large files from the v1.0-assets
         * GitHub release.
         */
        streamingAssetsUrl:
            "StreamingAssets",

        companyName:
            "EDUrocks Group, Truffled, GN-Math",

        productName:
            "Hollow Knight SilkSong",

        productVersion:
            "1.0",

        showBanner:
            unityShowBanner
    };


    /* =========================================================
       START UNITY
       ========================================================= */

    loadingBar.style.display =
        "block";

    loadingText.style.display =
        "block";

    loadingText.textContent =
        "LOADING UNITY...";


    const script =
        document.createElement("script");


    /*
     * OUR OWN UNITY LOADER
     *
     * This is now stored in:
     *
     * Build/w-pt.loader.js
     */
    script.src =
        "Build/w-pt.loader.js";


    script.onload = function () {

        loadingText.textContent =
            "STARTING GAME...";


        createUnityInstance(
            canvas,
            config,
            function (progress) {

                progressBarFull.style.width =
                    (progress * 100) + "%";

                loadingText.textContent =
                    "LOADING GAME... " +
                    Math.round(progress * 100) +
                    "%";

            }
        )
        .then(function (unityInstance) {

            /*
             * UNITY IS READY.
             *
             * Remove the large loading text and
             * Unity loading bar so they don't cover
             * part of the game.
             */

            loadingText.style.display =
                "none";

            loadingBar.style.display =
                "none";

        })
        .catch(function (message) {

            console.error(
                "Unity failed to start:",
                message
            );

            loadingText.textContent =
                "FAILED TO LOAD GAME";

            unityShowBanner(
                message,
                "error"
            );
        });

    };


    /* =========================================================
       LOADER ERROR
       ========================================================= */

    script.onerror = function () {

        loadingText.textContent =
            "FAILED TO LOAD UNITY";

        unityShowBanner(
            "Could not load Unity loader.",
            "error"
        );

    };


    document.body.appendChild(script);

</script>

</body>
</html>
